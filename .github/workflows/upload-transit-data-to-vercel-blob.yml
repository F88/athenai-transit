name: Update Transit Data (Vercel Blob)

# Build the latest Athenai Transit data from upstream open data (GTFS / ODPT)
# and publish it by uploading to Vercel Blob (served to the app via /data/v2).
# Same pipeline as update-transit-data.yml; only the publish destination differs.

on:
  schedule:
    # JST 09:00 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      skip_download:
        description: 'Skip GTFS download (JSON rebuild only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: gtfs-pipeline
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      # ── Setup ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v7

      # Required: actions/checkout checks out the commit that triggered
      # the run. On rerun, this is the OLD commit — the previous run's
      # push is not included. git pull fetches the latest HEAD so that
      # the subsequent git push in the commit step won't be rejected
      # as non-fast-forward.
      - name: Sync with remote
        run: git pull --ff-only origin main

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Download ───────────────────────────────────────────
      # Exit codes: 0=OK, 1=partial failure, 2=all failed.
      # Continue on partial failure (exit 1), stop on all failed (exit 2).
      - name: Download GTFS data
        id: download-gtfs
        if: ${{ !inputs.skip_download }}
        env:
          ODPT_ACCESS_TOKEN: ${{ secrets.ODPT_ACCESS_TOKEN }}
        # npx tsx direct: npm script contains --env-file-if-exists which
        # could load a local .env and override CI secrets.
        run: |
          set +e
          npx tsx pipeline/scripts/pipeline/download-gtfs.ts --targets pipeline/config/targets/download-gtfs.ts
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Warn on GTFS partial failure
        if: ${{ !inputs.skip_download && steps.download-gtfs.outputs.exit_code == '1' }}
        run: echo "::warning::Some GTFS downloads failed (partial failure)."

      - name: Fail on GTFS download failure
        if: ${{ !inputs.skip_download && steps.download-gtfs.outputs.exit_code == '2' }}
        run: |
          echo "::error::All GTFS downloads failed."
          exit 1

      - name: Download ODPT JSON data
        id: download-odpt-json
        if: ${{ !inputs.skip_download }}
        env:
          ODPT_ACCESS_TOKEN: ${{ secrets.ODPT_ACCESS_TOKEN }}
        # npx tsx direct: npm script contains --env-file-if-exists which
        # could load a local .env and override CI secrets.
        run: |
          set +e
          npx tsx pipeline/scripts/pipeline/download-odpt-json.ts --targets pipeline/config/targets/download-odpt-json.ts
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Warn on ODPT JSON partial failure
        if: ${{ !inputs.skip_download && steps.download-odpt-json.outputs.exit_code == '1' }}
        run: echo "::warning::Some ODPT JSON downloads failed (partial failure)."

      - name: Fail on ODPT JSON download failure
        if: ${{ !inputs.skip_download && steps.download-odpt-json.outputs.exit_code == '2' }}
        run: |
          echo "::error::All ODPT JSON downloads failed."
          exit 1

      # ── Transform (GTFS CSV → SQLite) ──────────────────────
      # Exit codes: 0=OK, 1=partial failure, 2=all failed.
      # Build steps use npm run (no --env-file-if-exists, safe for CI).
      - name: Build SQLite DB
        id: build-db
        run: |
          set +e
          npm run pipeline:build:db
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Warn on DB build partial failure
        if: steps.build-db.outputs.exit_code == '1'
        run: echo "::warning::Some DB builds failed (partial failure)."

      - name: Fail on DB build failure
        if: steps.build-db.outputs.exit_code == '2'
        run: |
          echo "::error::All DB builds failed."
          exit 1

      # ── Transform v2 (DB → v2 JSON bundles) ─────────────────
      # Exit codes: 0=OK, 1=partial failure, 2=all failed.
      # Continue on partial failure (exit 1), stop on all failed (exit 2).
      - name: Build v2 data from GTFS
        id: build-v2-data
        run: |
          set +e
          npm run pipeline:build:v2-data
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Warn on v2 data build partial failure
        if: steps.build-v2-data.outputs.exit_code == '1'
        run: echo "::warning::Some v2 data builds failed (partial failure)."

      - name: Fail on v2 data build failure
        if: steps.build-v2-data.outputs.exit_code == '2'
        run: |
          echo "::error::All v2 data builds failed."
          exit 1

      - name: Build v2 ODPT Train data
        id: build-v2-odpt-train
        run: |
          set +e
          npm run pipeline:build:v2-odpt-train
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Warn on v2 ODPT Train build partial failure
        if: steps.build-v2-odpt-train.outputs.exit_code == '1'
        run: echo "::warning::Some v2 ODPT Train builds failed (partial failure)."

      - name: Fail on v2 ODPT Train build failure
        if: steps.build-v2-odpt-train.outputs.exit_code == '2'
        run: |
          echo "::error::All v2 ODPT Train builds failed."
          exit 1

      - name: Build v2 route shapes from GTFS
        id: build-v2-shapes-gtfs
        run: |
          set +e
          npm run pipeline:build:v2-shapes:gtfs
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Warn on v2 GTFS shapes build partial failure
        if: steps.build-v2-shapes-gtfs.outputs.exit_code == '1'
        run: echo "::warning::Some v2 GTFS shapes builds failed (partial failure)."

      - name: Fail on v2 GTFS shapes build failure
        if: steps.build-v2-shapes-gtfs.outputs.exit_code == '2'
        run: |
          echo "::error::All v2 GTFS shapes builds failed."
          exit 1

      - name: Build v2 route shapes from KSJ railway
        id: build-v2-shapes-ksj
        run: |
          set +e
          npm run pipeline:build:v2-shapes:ksj
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Warn on v2 KSJ shapes build partial failure
        if: steps.build-v2-shapes-ksj.outputs.exit_code == '1'
        run: echo "::warning::Some v2 KSJ shapes builds failed (partial failure)."

      - name: Fail on v2 KSJ shapes build failure
        if: steps.build-v2-shapes-ksj.outputs.exit_code == '2'
        run: |
          echo "::error::All v2 KSJ shapes builds failed."
          exit 1

      # Per-source batch step: builds each source's insights.json
      # (InsightsBundle) from its data.json. NOTE: the global insights step
      # below does NOT consume this output -- it derives independently from
      # data.json, despite the similar name.
      - name: Build v2 insights
        id: build-v2-insights
        run: |
          set +e
          npm run pipeline:build:v2-insights
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Warn on v2 insights build partial failure
        if: steps.build-v2-insights.outputs.exit_code == '1'
        run: echo "::warning::Some v2 insights builds failed (partial failure)."

      - name: Fail on v2 insights build failure
        if: steps.build-v2-insights.outputs.exit_code == '2'
        run: |
          echo "::error::All v2 insights builds failed."
          exit 1

      # Global aggregate step: exit code comes from determineAggregateExitCode,
      # not the per-source batch runner above. exit 1 = some inputs skipped but
      # >=1 succeeded; exit 2 = all inputs missing or failed. Hence the
      # "inputs skipped / missing or failed" wording (not "builds failed") below.
      - name: Build v2 global insights
        id: build-v2-global-insights
        run: |
          set +e
          npm run pipeline:build:v2-global-insights
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Warn on v2 global insights partial failure
        if: steps.build-v2-global-insights.outputs.exit_code == '1'
        run: echo "::warning::Some v2 global insights inputs were skipped (partial failure)."

      - name: Fail on v2 global insights build failure
        if: steps.build-v2-global-insights.outputs.exit_code == '2'
        run: |
          echo "::error::All v2 global insights inputs were missing or failed."
          exit 1

      # Global aggregate step (same as above): exit code from
      # determineAggregateExitCode. exit 1 = some entries skipped but >=1
      # succeeded; exit 2 = all entries failed, or its required global-insights
      # input is missing. Hence the "entries skipped / global insights missing"
      # wording below.
      - name: Build v2 data source catalog
        id: build-v2-data-source-catalog
        run: |
          set +e
          npm run pipeline:build:v2-data-source-catalog
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Warn on v2 data source catalog partial failure
        if: steps.build-v2-data-source-catalog.outputs.exit_code == '1'
        run: echo "::warning::Some v2 data source catalog entries were skipped (partial failure)."

      - name: Fail on v2 data source catalog build failure
        if: steps.build-v2-data-source-catalog.outputs.exit_code == '2'
        run: |
          echo "::error::All v2 data source catalog entries failed or global insights missing."
          exit 1

      # ── Validate ───────────────────────────────────────────
      # Exit codes: 0=OK, 1=warnings, 2=errors.
      # Continue on warnings (exit 1), stop on errors (exit 2).
      - name: Validate v2 bundles
        id: validate-v2
        run: |
          set +e
          npm run pipeline:validate:v2 2>&1 | tee validate-v2-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          cat validate-v2-output.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on v2 validation errors
        if: steps.validate-v2.outputs.exit_code == '2'
        run: |
          echo "::error::V2 bundle validation failed. See Job Summary for details."
          exit 1

      #  disabled: replaced by Vercel Blob upload below
      # - name: Sync to public/
      #   run: npm run pipeline:deliver:local

      # ── Upload to Vercel Blob ──────────────────────────────
      # Replaces "Sync to public/" and committing public/<data dir> to git:
      # instead, upload the build output straight to a Vercel Blob store. The
      # app fetches it via the same-origin /data/v2/* rewrite in vercel.json.
      # Reads the build output directly, so no pipeline:deliver:local is needed.
      #
      # Exit codes: 0=OK, 1=partial failure or other error, 2=all failed.
      # npx tsx direct: the npm script contains --env-file-if-exists which could
      # load a local .env and override CI secrets.
      - name: Upload v2 data to Vercel Blob
        id: upload-blob
        env:
          VERCEL_V3_BLOB_READ_WRITE_TOKEN: ${{ secrets.VERCEL_V3_BLOB_READ_WRITE_TOKEN }}
        run: |
          set +e
          npx tsx pipeline/scripts/pipeline/vercel-blob/upload-data-to-blob.ts --dir pipeline/workspace/_build/data-v2 --all 2>&1 | tee blob-upload-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Warn on Blob upload partial failure
        if: steps.upload-blob.outputs.exit_code == '1'
        run: echo "::warning::Some data files failed to upload to Blob (partial failure or other error)."

      - name: Fail on Blob upload failure
        if: steps.upload-blob.outputs.exit_code == '2'
        run: |
          echo "::error::All Blob uploads failed."
          exit 1

      # ── Report & Commit ────────────────────────────────────
      - name: Detect changes
        id: changes
        run: |
          # Commit target: only the pipeline state (download metadata under
          # workspace/state/). The data itself is uploaded to Vercel Blob, not
          # committed to git.
          git add pipeline/workspace/state/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No metadata changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Metadata changes detected. Will commit and push."
          fi

      - name: Job Summary
        if: always()
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # Primary: Blob upload result. The data is delivered to Vercel Blob,
          # not committed to git, so the git diff further below is metadata only.
          echo "## Blob upload" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f blob-upload-output.txt ]; then
            # Summary line ("Done: N uploaded, M failed") + any failures ("ERR ...").
            # The full stdout (per-file "ok" lines) is available in the job log,
            # so only the summary and failures are surfaced here.
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E '^Done:|ERR ' blob-upload-output.txt >> "$GITHUB_STEP_SUMMARY" \
              || echo "(no Done/ERR lines captured)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Blob upload output captured (upload step may have been skipped)." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          # Secondary: git metadata diff (download state under workspace/state/).
          if [ "${{ steps.changes.outputs.changed }}" = "true" ]; then
            echo "## Updated metadata" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## No metadata change" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Data uploaded to Blob; download metadata unchanged. No commit created." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit & Push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit target: only the pipeline state (download metadata under
          # workspace/state/). The data itself is uploaded to Vercel Blob, not
          # committed to git.
          git add pipeline/workspace/state/
          git commit -m "chore(pipeline): update download metadata"
          git push

      # ── Notify ────────────────────────────────────────────
      - name: Build update summary
        id: update-summary
        if: always()
        shell: bash
        run: |
          PARTS=()
          HAS_WARN=false
          # Primary action
          PARTS+=("Uploaded to Vercel Blob")
          # Partial failures (exit code 1)
          WARN=""
          if [ "${{ steps.download-gtfs.outputs.exit_code }}" = "1" ]; then WARN="${WARN}GTFS download, "; fi
          if [ "${{ steps.download-odpt-json.outputs.exit_code }}" = "1" ]; then WARN="${WARN}ODPT download, "; fi
          if [ "${{ steps.build-db.outputs.exit_code }}" = "1" ]; then WARN="${WARN}DB build, "; fi
          if [ "${{ steps.build-v2-data.outputs.exit_code }}" = "1" ]; then WARN="${WARN}v2 data, "; fi
          if [ "${{ steps.build-v2-odpt-train.outputs.exit_code }}" = "1" ]; then WARN="${WARN}v2 ODPT Train, "; fi
          if [ "${{ steps.build-v2-shapes-gtfs.outputs.exit_code }}" = "1" ]; then WARN="${WARN}v2 GTFS shapes, "; fi
          if [ "${{ steps.build-v2-shapes-ksj.outputs.exit_code }}" = "1" ]; then WARN="${WARN}v2 KSJ shapes, "; fi
          if [ "${{ steps.build-v2-insights.outputs.exit_code }}" = "1" ]; then WARN="${WARN}v2 insights, "; fi
          if [ "${{ steps.build-v2-global-insights.outputs.exit_code }}" = "1" ]; then WARN="${WARN}v2 global insights, "; fi
          if [ "${{ steps.build-v2-data-source-catalog.outputs.exit_code }}" = "1" ]; then WARN="${WARN}v2 data source catalog, "; fi
          if [ "${{ steps.upload-blob.outputs.exit_code }}" = "1" ]; then WARN="${WARN}Blob upload, "; fi
          if [ -n "$WARN" ]; then
            PARTS+=("Partial failure: ${WARN%, }")
            HAS_WARN=true
          fi
          IFS=', '; echo "text=${PARTS[*]}" >> "$GITHUB_OUTPUT"
          echo "has_warn=$HAS_WARN" >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: always()
        uses: ./.github/actions/slack-notify
        with:
          result: ${{ steps.update-summary.outputs.has_warn == 'true' && 'warning' || job.status }}
          summary: ${{ steps.update-summary.outputs.text }}
          channel_id: ${{ vars.SLACK_CHANNEL_ID }}
          slack_bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
